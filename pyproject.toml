[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "netcircuit-simulator"
version = "0.1.1"
description = "Deterministic digital and bounded DC simulation for CIRNET"
readme = "README.md"
requires-python = ">=3.11"
license-files = ["LICENSE"]
dependencies = ["netcircuit-contracts==0.1.1", "jsonschema==4.26.0"]

[project.urls]
Repository = "https://github.com/CIRNETLAB/CIRNET-Simulator"
Documentation = "https://github.com/CIRNETLAB/CIRNET-Simulator/blob/master/README.md"

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[tool.setuptools.packages.find]
include = ["netcircuit_sim*"]
namespaces = false

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider --import-mode=importlib"
testpaths = ["tests"]
